name: Local agent virtual OS smoke tests
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'windows/**', 'shared/**', 'tools/test_agent_*.py', 'tools/windows_sandbox_smoke.ps1', '.github/workflows/agent-sandbox.yml']
permissions:
  contents: read
env:
  ACCESSIA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  browser-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'playwright==1.62.0'
      - run: python -m playwright install --with-deps chromium
      - run: python tools/test_agent_dom.py
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 'platforms;android-37.2' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM for this ephemeral runner only
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle -p android :app:connectedDebugAndroidTest --no-daemon
            mkdir -p sandbox-evidence
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 exec-out run-as org.accessia.browser.beta03 cat files/sandbox-01-inicio.png > sandbox-evidence/android-${{ matrix.api }}-01-inicio.png
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 exec-out run-as org.accessia.browser.beta03 cat files/sandbox-02-menu.png > sandbox-evidence/android-${{ matrix.api }}-02-menu.png
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 exec-out run-as org.accessia.browser.beta03 cat files/sandbox-03-asistente.png > sandbox-evidence/android-${{ matrix.api }}-03-asistente.png
      - name: Save real emulator screenshot if available
        if: always()
        run: |
          mkdir -p sandbox-evidence
          printf 'commit=%s\nhead_commit=%s\nplatform=Android API %s x86_64 emulator\nphysical_device=false\n' "$GITHUB_SHA" "$ACCESSIA_HEAD_SHA" '${{ matrix.api }}' > sandbox-evidence/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ACCESSIA-Android-API-${{ matrix.api }}-sandbox-evidence
          path: |
            sandbox-evidence/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
  windows-vm:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project windows/Accessia.Agent.Tests/Accessia.Agent.Tests.csproj -c Release
      - run: dotnet publish windows/Accessia.Windows/Accessia.Windows.csproj -c Release -r win-x64 --self-contained false -o windows-publish
      - name: Launch actual Windows application on the runner desktop
        shell: pwsh
        run: ./tools/windows_sandbox_smoke.ps1 -Executable ./windows-publish/Accessia.Windows.exe -OutputDirectory ./sandbox-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ACCESSIA-Windows-VM-sandbox-evidence
          path: sandbox-evidence/
