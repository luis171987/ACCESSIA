name: Android build smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths: ['android/**', 'shared/**', '.github/workflows/build-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 'platforms;android-37.2' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: cd android && gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ACCESSIA-Android-unit-test-results
          path: android/app/build/test-results/testDebugUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: ACCESSIA-Android-debug-unverified
          path: android/app/build/outputs/apk/debug/app-debug.apk
