name: ACCESSIA JS tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_public_secrets.py
      - run: python -m unittest discover -s tools/tests -p "test_*.py"
      - run: node --test shared/tests/*.test.js
